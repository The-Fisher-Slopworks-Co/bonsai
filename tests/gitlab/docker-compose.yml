name: bonsai-gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    platform: linux/arm64
    hostname: localhost
    restart: unless-stopped
    shm_size: 256m
    ports:
      - "8929:8929"
      - "2224:22"
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        registry['enable'] = false
        gitlab_kas['enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
    volumes:
      - bonsai-gitlab-config:/etc/gitlab
      - bonsai-gitlab-logs:/var/log/gitlab
      - bonsai-gitlab-data:/var/opt/gitlab
  runner:
    image: gitlab/gitlab-runner:latest
    restart: unless-stopped
    depends_on: [gitlab]
    volumes:
      - bonsai-runner-config:/etc/gitlab-runner
volumes:
  bonsai-gitlab-config:
  bonsai-gitlab-logs:
  bonsai-gitlab-data:
  bonsai-runner-config:
